        :root {

            --text-color: #e0e0e0;

        body, html {

            padding: 0;
            width: 100%;
            height: 100%;
        }

        html {
            background-color: var(--bg-color);
        }

        body {
            background: radial-gradient(circle at center, #1a1a1a 0%, #050505 100%);
            color: var(--text-color);
            font-family: 'Lora', "Songti SC", "SimSun", serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        /* --- Book Cover Styles --- */
        #book-cover {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #252525 0%, #0a0a0a 100%);
            z-index: 50;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;

            transform-origin: left center;
            transition: transform 1.8s cubic-bezier(0.645, 0.045, 0.355, 1), opacity 1.8s ease-out;
            box-shadow: inset 20px 0 80px rgba(0,0,0,0.9);
            cursor: pointer;
        }

        #book-cover.book-open {
            transform: perspective(2000px) rotateY(-110deg);
            opacity: 0;
            pointer-events: none;
        }

        .cover-title {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: var(--accent-color);
            margin-bottom: 20px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .tap-hint {
            margin-top: 80px;
            font-family: 'Open Sans', sans-serif;
            font-size: 1.0rem; /* Adjusted size */
            letter-spacing: 0.2em;
            color: var(--text-color);
            opacity: 0.5;
            animation: pulse 2s infinite;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px 30px; /* Adjusted padding */
            border-radius: 25px; /* Adjusted radius */
            transition: all 0.3s;
        }

        #book-cover:hover .tap-hint {
            background: rgba(255,255,255,0.05);
            opacity: 0.8;
        }

        @keyframes pulse {
            0% { opacity: 0.3; transform: scale(1); }n            50% { opacity: 0.7; transform: scale(1.05); }n            100% { opacity: 0.3; transform: scale(1); }n        }

        /* --- Main Content Styles --- */
        .container {
            text-align: center;
            max-width: 80vw;
            position: relative;
            z-index: 10;
        }

        /* Language Selector - Above Cover */
        .lang-selector {
            position: absolute;
            top: calc(env(safe-area-inset-top) + 20px);
            right: 20px;
            z-index: 100; /* Ensure clickable even when cover is present */
        }

        .lang-selector select {
            background: rgba(0,0,0,0.5);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 6px 24px;
            font-family: 'Open Sans', sans-serif;

            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1;
            opacity: 0.3;

            top: 0;
            height: 30vh;
        }

            bottom: 0;
            height: 30vh;
        }

            from { opacity: 0; }

            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;

            left: 0;

        .btn-cookie {

            color: var(--accent-color);

            color: #000;
        }

            background: #c0b7aa;
        }

        /* --- PWA Refresh Button --- */
        .refresh-btn {
            position: fixed;
            bottom: 30px;
            right: 30px; 
            width: 44px;
            height: 44px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--accent-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 95; /* Ensure above share if they overlap during transition */
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.5s ease;
            pointer-events: none;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: none; 
        }

        .refresh-btn.visible {
            display: flex; 
        }

        .refresh-btn.show {
            opacity: 0.8;
            transform: scale(1);
            pointer-events: auto;
        }

        .refresh-btn:hover {
            background: var(--accent-color);
            opacity: 1;
        }

        .refresh-btn:hover svg {
            stroke: #000;
        }

        .refresh-icon {
            width: 20px;
            height: 20px;
            stroke: var(--accent-color);
            stroke-width: 2;
            fill: none;
            transition: stroke 0.3s;
        }

        /* --- Share Feature --- */
        .share-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 90;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.5s ease;
            pointer-events: none;
        }
        
        /* When in PWA, move share button above refresh button */
        body.is-pwa .share-container {
            bottom: 90px; /* 30 (bottom) + 44 (refresh-btn height) + 16 (gap) */
        }
        
        .share-container.show {
            opacity: 0.8;
            transform: scale(1);
            pointer-events: auto;
        }

        .btn-share {
            width: 44px;
            height: 44px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--accent-color);
            border-radius: 50%;
            color: var(--accent-color);
            padding: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        
        .btn-share span {
            display: none; /* Hide text, icon only */
        }

        .btn-share:hover {
            background: var(--accent-color);
            color: #000;
            opacity: 1;
            transform: none;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(5px);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: #111;
            border: 1px solid var(--accent-color);
            border-radius: 8px;
            padding: 20px;
            max-width: 90%;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            position: relative;
        }

        .modal-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            color: var(--accent-color);
            font-family: 'Lora', serif;
        }

        .close-btn {
            background: none;
            border: none;
            color: #666;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0 5px;
        }
        
        .close-btn:hover { color: #fff; }

        #share-img {
            max-width: 100%;
            max-height: 60vh;
            border: 1px solid #333;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .share-tip {
            font-size: 0.75rem;
            color: #888;
            margin: 10px 0;
            font-family: 'Open Sans', sans-serif;
        }

        .btn-download {
            background: var(--accent-color);
            color: #050505;
            text-decoration: none;
            padding: 10px 24px;
            border-radius: 4px;
            font-family: 'Open Sans', sans-serif;
            font-size: 0.85rem;
            font-weight: bold;
            display: inline-block;
            transition: background 0.3s;

            background: #c0b7aa;

        /* --- Immediate Mode (No Flash) --- */
        body.immediate-mode #book-cover {
            display: none !important;
            opacity: 0 !important;
            pointer-events: none !important;

        body.immediate-mode .symbol-container,

        body.immediate-mode #status {
            opacity: 1 !important;
            transform: none !important;
            animation: none !important;
            filter: none !important;
        }

        body.immediate-mode #author[data-has-author="true"] {
            opacity: 1 !important;
            transform: none !important;
        }

        /* Mobile Optimization for Cookie Banner */
        @media (max-width: 600px) {
            #cookie-banner {
                align-items: flex-start;

            .cookie-text {

                text-align: center;

                font-size: 0.75rem;
                white-space: nowrap; /* Prevent button text wrapping */
            }
        }
    </style>

    <script>
        // Critical: Blocking script to prevent FOUC (Flash of Unstyled Content/Cover)
        try {
            (function() {
                var raw = localStorage.getItem('boa_lock_data');
                if (raw) {
                    var data = JSON.parse(raw);
                    // 30 mins = 30 * 60 * 1000
                    if (Date.now() - data.timestamp < 1800000) {
                        document.body.classList.add('immediate-mode');
                    }
                }
            })();

        async function fetchAnswer() {
            if (cachedResult) return cachedResult;

            // --- 1. Client-Side Lock Check (Always check first for continuity) ---
            // Even if consent is granted, we might have a valid local lock from the previous request
            // preventing a sudden answer switch before the cookie is established.
            try {
                const rawLock = localStorage.getItem(LOCAL_LOCK_KEY);
                if (rawLock) {
                    const lockData = JSON.parse(rawLock);
                    const now = Date.now();
                    // Check if lock is still valid (30 mins)
                    if (now - lockData.timestamp < LOCK_DURATION_MINUTES * 60 * 1000) {
                        console.log("Using client-side lock");
                        cachedResult = {
                            answerObj: lockData.answer,
                            timestamp: lockData.timestamp,
                            isCached: true
                        };
                        return cachedResult;
                    }
                }
            } catch (e) {
                console.warn("Failed to read local lock:", e);
            }

            try {
                // --- 2. Network Fetch ---
                const queryParams = new URLSearchParams(window.location.search);
                
                // Privacy by Default: 
                // If consent is 'denied' OR 'null' (not yet chosen), do NOT set cookies.
                // Only set cookies if explicitly 'granted'.
                if (consentStatus !== 'granted') {
                    queryParams.append('no_cookie', 'true');
                }

                const response = await fetch('/api/answer?' + queryParams.toString());
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                
                const serverTs = data.timestamp * 1000;

                // --- 3. Client-Side Lock Save (Always save) ---
                // We save to localStorage even if consent is granted. 
                // This acts as a client-side cache/backup and ensures smooth transitions.
                const lockPayload = {
                    timestamp: (consentStatus === 'granted' && data.is_cached) ? serverTs : Date.now(),
                    answer: data.answer
                };
                localStorage.setItem(LOCAL_LOCK_KEY, JSON.stringify(lockPayload));

                // If not granted, we rely on client-side lock for 'caching' status in UI
                // For the very first load, data.is_cached from server will be false (because no cookie sent)
                const isCached = (consentStatus === 'granted') ? data.is_cached : false;

                cachedResult = {
                    answerObj: data.answer,
                    timestamp: (consentStatus === 'granted') ? serverTs : Date.now(),
                    isCached: isCached
                };
                return cachedResult;
            } catch (e) {
                console.error("Failed to fetch answer:", e);
                // Fallback for connection error
                return {
                    answerObj: {
                        zh: "无法连接服务器",
                        "zh-TW": "無法連接伺服器",

                        ja: "接続エラー",
                        ko: "연결 오류"
                    },
                    timestamp: Date.now(),
                    isCached: false
                };
            }
        }

            if (diff <= 0) return 0;
            return Math.ceil(diff / 60000);
        }

        // --- Share Logic ---
        
        function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
            const words = text.split(''); // Char by char for CJK
            // But for English we should split by space, simplistic approach for mixed:
            // Since we use 'Lora' which is variable width, we need a smarter split or just char by char
            // For mixed content, word-level split is better but CJK doesn't use spaces.
            
            // Hybrid approach: Split by words if space exists, otherwise chars?
            // Let's stick to simple char loop for now, it handles both well enough for short answers.
            
            // Improved: use actual words for EN, chars for CJK?
            // Simple approach:
            let line = '';
            let lines = [];
            
            // Check if text has spaces (Western)
            const isWestern = text.includes(' ');
            const atoms = isWestern ? text.split(' ') : text.split('');
            const separator = isWestern ? ' ' : '';
            
            for(let n = 0; n < atoms.length; n++) {
                const testLine = line + atoms[n] + separator;
                const metrics = ctx.measureText(testLine);
                const testWidth = metrics.width;
                if (testWidth > maxWidth && n > 0) {
                    lines.push(line);
                    line = atoms[n] + separator;
                } else {
                    line = testLine;
                }
            }
            lines.push(line);
            
            // Draw lines centered
            let startY = y - ((lines.length - 1) * lineHeight) / 2;
            for(let k = 0; k < lines.length; k++){
                ctx.fillText(lines[k].trim(), x, startY + (k * lineHeight));
            }
        }

        function createShareCard() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            // Set High Res
            const W = 1080;
            const H = 1920;
            canvas.width = W;
            canvas.height = H;

            // 1. Background
            // Radial Gradient matching website: #1a1a1a at center, #050505 at edges
            const grad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, H);
            grad.addColorStop(0, '#1a1a1a');
            grad.addColorStop(1, '#050505');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);
            
            // Add noise/stars (simple)
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            for(let i=0; i<100; i++) {
                const x = Math.random() * W;
                const y = Math.random() * H;
                const r = Math.random() * 2;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI*2);
                ctx.fill();
            }

            // 2. Vertical Lines (The Mystic Lines)
            // 30vh logic: 1920 * 0.3 = 576px
            ctx.lineWidth = 2;
            
            // Top Line
            const gradTop = ctx.createLinearGradient(W/2, 0, W/2, 576);
            gradTop.addColorStop(0, 'rgba(168, 159, 145, 0)');
            gradTop.addColorStop(0.5, 'rgba(168, 159, 145, 0.5)');
            gradTop.addColorStop(1, 'rgba(168, 159, 145, 0)');
            ctx.strokeStyle = gradTop;
            ctx.beginPath();
            ctx.moveTo(W/2, 0);
            ctx.lineTo(W/2, 576);
            ctx.stroke();

            // Bottom Line
            const gradBot = ctx.createLinearGradient(W/2, H, W/2, 1344);
            gradBot.addColorStop(0, 'rgba(168, 159, 145, 0)');
            gradBot.addColorStop(0.5, 'rgba(168, 159, 145, 0.5)');
            gradBot.addColorStop(1, 'rgba(168, 159, 145, 0)');
            ctx.strokeStyle = gradBot;
            ctx.beginPath();
            ctx.moveTo(W/2, H);
            ctx.lineTo(W/2, 1344);
            ctx.stroke();

            // 3. Symbol (Geometric)
            // Scale 3.3 to match ~30vw (1080 * 0.3 = 324px)
            // Center y=650 (will slightly overlap top line, matching web z-index)
            ctx.save();
            ctx.translate(W/2, 650); 
            ctx.scale(3.3, 3.3); 
            ctx.lineWidth = 1.5;
            
            // Circles
            // Outer: 0.3 opacity
            ctx.strokeStyle = 'rgba(168, 159, 145, 0.3)';
            ctx.beginPath(); ctx.arc(0, 0, 45, 0, Math.PI*2); ctx.stroke(); 
            
            // Inner: 0.5 opacity
            ctx.strokeStyle = 'rgba(168, 159, 145, 0.5)';
            ctx.beginPath(); ctx.arc(0, 0, 35, 0, Math.PI*2); ctx.stroke(); 
            
            // Star/Diamond Path: 0.8 opacity
            ctx.strokeStyle = 'rgba(168, 159, 145, 0.8)';
            ctx.beginPath();
            const points = [
                [0, -45], [15, -15], [45, 0], [15, 15], 
                [0, 45], [-15, 15], [-45, 0], [-15, -15]
            ];
            ctx.moveTo(points[0][0], points[0][1]);
            for(let i=1; i<points.length; i++) {
                ctx.lineTo(points[i][0], points[i][1]);
            }
            ctx.closePath();
            ctx.stroke();
            
            // Center dot
            ctx.fillStyle = '#a89f91';
            ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI*2); ctx.fill();
            
            ctx.restore();

            // 4. Answer
            // Center roughly at 960 (true center)
            const answerEl = document.getElementById('answer');
            const text = answerEl.innerText;
            
            ctx.fillStyle = '#e0e0e0';
            ctx.textAlign = 'center';
            
            // Adjust font size based on text length
            let fontSize = 90;
            if (text.length > 50) fontSize = 70;
            if (text.length > 100) fontSize = 50;
            
            ctx.font = `bold ${fontSize}px Lora, "Songti SC", serif`;
            
            // Vertical center area
            wrapText(ctx, text, W/2, 960, W - 200, fontSize * 1.5);

            // 5. Author?
            if (cachedResult && cachedResult.answerObj && cachedResult.answerObj.author_en) {
                ctx.fillStyle = '#a89f91';
                ctx.font = '40px "Open Sans", sans-serif';
                ctx.fillText(`- ${cachedResult.answerObj.author_en}`, W/2, 1250); 
            }

            // 6. Footer / URL
            ctx.fillStyle = 'rgba(168, 159, 145, 0.5)';
            ctx.font = '30px "Open Sans", sans-serif';
            ctx.fillText("the-book-of-answers.online", W/2, 1850);

            // Export
            const dataUrl = canvas.toDataURL('image/png');
            const imgEl = document.getElementById('share-img');
            const modal = document.getElementById('share-modal');
            const dlLink = document.getElementById('download-link');
            
            imgEl.src = dataUrl;
            dlLink.href = dataUrl;
            
            // Show Modal
            modal.classList.add('open');
        }

        function closeShareModal(e) {
            const modal = document.getElementById('share-modal');
            modal.classList.remove('open');
        }

        // --- End Share Logic ---

        async function init() {
            // Apply language preference
            document.getElementById('languageSelect').value = currentLang;
            
            // Check Consent Banner
            if (!consentStatus) {
                setTimeout(() => {
                    const banner = document.getElementById('cookie-banner');
                    if(banner) banner.classList.add('show');
                }, 1000);
            }

            // Init PWA Button
            if (isPWA()) {
                const btn = document.getElementById('refreshBtn');
                if (btn) btn.classList.add('visible');
                document.body.classList.add('is-pwa');
            }

            const isImmediate = document.body.classList.contains('immediate-mode');

            if (isImmediate) {
                // Mode: Immediate (Cached)
                // 1. Set internal state
                showAnswerImmediate();
                
                // 2. Fetch/Load data (this will be very fast from local lock)
                // We don't await here to let the script finish, 
                // but since data is local, renderUI happens almost instantly.
                await updateUI();
                
            } else {
                // Mode: Normal (New Visit or Expired)
                // 1. Start Auto Open Timer
                startAutoOpenTimer();
                
                // 2. Preload content
                const result = await updateUI();

                // Edge case handling:
                // If local storage was empty (no immediate-mode), but server says "Cached" (cookie valid),
                // we should switch to immediate mode now.
                if (result && result.isCached && !isBookOpen) {
                    // Manually trigger immediate mode styles
                    document.body.classList.add('immediate-mode'); 
                    showAnswerImmediate();
                }
            }
        }

        // Run on load
        window.addEventListener('DOMContentLoaded', init);

    </script>
</body>
